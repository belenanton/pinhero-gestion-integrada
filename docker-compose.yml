version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pinhero
      POSTGRES_PASSWORD: pinhero123
      POSTGRES_DB: gestion_integrada
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
    ports:
      - '4000:4000'
    environment:
      DATABASE_URL: postgres://pinhero:pinhero123@db:5432/gestion_integrada
      PORT: 4000
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:4000
    depends_on:
      - backend

volumes:
  postgres_data:
